name: CI

on:
  pull_request:
    branches: [beta, main]
  push:
    branches: [beta, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tests, build, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Use declared npm version
        run: npm install --global npm@11.5.2
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Contract notice mock tests
        run: npm run test:contract-notices
      - name: Contract Edge typecheck
        run: npx --yes deno@2.5.4 check --frozen --config supabase/functions/contract-notices/deno.json --lock supabase/functions/contract-notices/deno.lock supabase/functions/contract-notices/index.ts
      - name: Offline beta UI tests
        run: npm run test:ui
        env:
          VITE_RELEASE_CHANNEL: beta
      - name: Disposable PostgreSQL authorization tests
        run: npm run test:sql
      - name: Native PostgreSQL concurrency regressions
        run: npm run test:sql:concurrency
      - name: Account Edge Function typecheck
        run: npx --yes deno@2.5.4 check --frozen --config supabase/functions/admin-accounts/deno.json supabase/functions/admin-accounts/index.ts
      - name: Production build
        run: npm run build
      - name: Existing beta target build (synthetic key, no network)
        run: npm run build
        env:
          VERCEL_GIT_COMMIT_REF: beta
          VITE_RELEASE_CHANNEL: beta
          VITE_SUPABASE_URL: https://exsquwjtqnirojntoxqv.supabase.co
          VITE_SUPABASE_ANON_KEY: synthetic-build-only
      - name: Lint
        run: npm run lint
